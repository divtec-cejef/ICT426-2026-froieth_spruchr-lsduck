<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="../res/icon.png">
    <title>Panier</title>
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="#">LS<span>Duck</span></a>
            <a class="back-btn" href="index.html">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                Continuer mes achats
            </a>
        </nav>
    </header>

    <div class="container">
        <h1>Mon panier <span id="count-badge" style="font-size:1rem;font-weight:500;color:var(--gris);font-family:'DM Sans',sans-serif;"></span></h1>

        <div id="cart-layout" class="cart-layout">
            <div class="cart-items" id="cart-items"></div>

            <aside class="summary-card" id="summary">
                <div class="summary-title">Récapitulatif</div>
                <div class="summary-lines">
                    <div class="summary-line"><span>Sous-total</span><span id="subtotal">—</span></div>
                    <div class="summary-line"><span>Livraison</span><span id="shipping">—</span></div>
                    <div class="summary-line total"><span>Total</span><span id="total">—</span></div>
                </div>
                <button onclick="finaliserCommande()" class="checkout-btn">Passer la commande →</button>
                <p class="delivery-note">🦆 Livraison gratuite dès 30 CHF · Paiement sécurisé</p>
            </aside>
        </div>
    </div>

    <script src="js/panier.js"></script>

    <footer>
        <p>&copy; 2026 LSDuck - Tous droits réservés</p>
        <p>🦆 Faites entrer la joie dans votre salle de bain ! 🦆</p>
    </footer>
</body>
</html>
