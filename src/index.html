<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Boutique de canards en plastique - Découvrez notre collection unique de canards de bain">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="../res/icon.png">

    <title>LSDuck</title>
</head>
<body>
<div class="container">

    <div class="BarreDeRecherche">

                id="searchInput"

    <div class="products-grid" id="results"></div>

    <script src="js/main.js"></script>

    <script src="js/footer.js"></script>
