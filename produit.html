<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Détail Produit | LSDuck</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --jaune:     #f5c800;
            --jaune-pale:#fff8d6;
            --sombre:    #1a1508;
            --gris:      #6b6453;
            --blanc:     #fdfaf2;
            --accent:    #e07b00;
            --radius:    14px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--blanc);
            color: var(--sombre);
            min-height: 100vh;
        }

        /* ── NAV ── */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 48px;
            border-bottom: 2px solid var(--jaune);
            background: var(--blanc);
            position: sticky; top: 0; z-index: 99;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--sombre);
            text-decoration: none;
        }
        .logo span { color: var(--jaune); }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: .9rem;
            font-weight: 500;
            color: var(--gris);
            text-decoration: none;
            transition: color .2s;
        }
        .back-btn:hover { color: var(--sombre); }
        .back-btn svg { transition: transform .2s; }
        .back-btn:hover svg { transform: translateX(-3px); }

        /* ── LAYOUT ── */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 56px 24px 80px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
        }

        /* ── IMAGE ── */
        .image-wrap {
            background: var(--jaune-pale);
            border-radius: var(--radius);
            border: 2px solid var(--jaune);
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .image-wrap img {
            width: 75%;
            height: 75%;
            object-fit: contain;
            transition: transform .4s ease;
        }
        .image-wrap:hover img { transform: scale(1.06) rotate(-2deg); }
        .badge-theme {
            position: absolute;
            top: 16px; right: 16px;
            background: var(--jaune);
            color: var(--sombre);
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 999px;
        }

        /* ── INFO ── */
        .info { display: flex; flex-direction: column; gap: 22px; }

        .product-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            font-weight: 800;
            line-height: 1.1;
            color: var(--sombre);
        }

        .product-desc {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--gris);
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .price {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }
        .stars {
            display: flex;
            gap: 3px;
            font-size: 1.1rem;
        }
        .star-filled { color: var(--jaune); }
        .star-empty  { color: #ddd; }

        /* ── DÉTAILS ── */
        .details-title {
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--gris);
            margin-bottom: 12px;
        }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .detail-item {
            background: var(--jaune-pale);
            border: 1px solid #ecdfa0;
            border-radius: 8px;
            padding: 10px 14px;
        }
        .detail-label {
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--gris);
            margin-bottom: 2px;
        }
        .detail-value {
            font-size: .92rem;
            font-weight: 500;
            color: var(--sombre);
        }

        /* ── BOUTON ── */
        .btn-panier {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: var(--jaune);
            color: var(--sombre);
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            border: 2px solid var(--sombre);
            border-radius: var(--radius);
            cursor: pointer;
            transition: background .2s, transform .15s;
            letter-spacing: .02em;
        }
        .btn-panier:hover {
            background: var(--accent);
            color: #fff;
            transform: translateY(-2px);
        }
        .btn-panier:active { transform: translateY(0); }

        /* ── AVIS ── */
        .avis-section { margin-top: 64px; }
        .section-heading {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--jaune);
            padding-bottom: 12px;
        }
        .avis-list { display: flex; flex-direction: column; gap: 14px; }
        .avis-card {
            background: var(--jaune-pale);
            border: 1px solid #ecdfa0;
            border-radius: var(--radius);
            padding: 18px 22px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .avis-header { display: flex; align-items: center; gap: 12px; }
        .avis-avatar {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: var(--jaune);
            border: 2px solid var(--sombre);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: .9rem;
            color: var(--sombre);
            flex-shrink: 0;
        }
        .avis-user { font-weight: 600; font-size: .95rem; }
        .avis-commentaire { font-size: .9rem; color: var(--gris); line-height: 1.5; }
        .avis-empty { color: var(--gris); font-style: italic; font-size: .95rem; }

        /* ── ERREUR / CHARGEMENT ── */
        .state-msg {
            text-align: center;
            padding: 100px 24px;
            font-size: 1.1rem;
            color: var(--gris);
        }
        .state-msg .emoji { font-size: 3rem; display: block; margin-bottom: 16px; }

        /* ── RESPONSIVE ── */
        @media (max-width: 720px) {
            nav { padding: 14px 20px; }
            .container { padding: 32px 16px 60px; }
            .product-grid { grid-template-columns: 1fr; gap: 32px; }
            .product-name { font-size: 2rem; }
        }
    </style>
</head>
<body>

<nav>
    <a class="logo" href="#">LSDuck</a>
    <a class="back-btn" href="index.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Retour à la boutique
    </a>
</nav>

<div class="container" id="app">
    <div class="state-msg"><span class="emoji">🦆</span>Chargement du produit…</div>
</div>

<script>
    // ─── Helpers ───────────────────────────────────────────────
    function getIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return parseInt(params.get('id'));
    }

    function etoiles(moyenne) {
        let html = '<div class="stars">';
        for (let i = 1; i <= 5; i++) {
            html += `<span class="${i <= Math.round(moyenne) ? 'star-filled' : 'star-empty'}">★</span>`;
        }
        html += '</div>';
        return html;
    }

    function moyenneAvis(avis) {
        if (!avis || avis.length === 0) return null;
        const total = avis.reduce((s, a) => s + a.note, 0);
        return (total / avis.length).toFixed(1);
    }

    function renderProduit(produit) {
        const app = document.getElementById('app');
        const moy = moyenneAvis(produit.avis);

        const detailsHTML = Object.entries(produit.details).map(([cle, val]) => `
      <div class="detail-item">
        <div class="detail-label">${cle.replace(/_/g, ' ')}</div>
        <div class="detail-value">${val}</div>
      </div>
    `).join('');

        const avisHTML = produit.avis.length > 0
            ? produit.avis.map(a => `
          <div class="avis-card">
            <div class="avis-header">
              <div class="avis-avatar">${a.utilisateur[0].toUpperCase()}</div>
              <div>
                <div class="avis-user">${a.utilisateur}</div>
                <div class="stars">${'★'.repeat(a.note)}${'☆'.repeat(5 - a.note)}</div>
              </div>
            </div>
            ${a.commentaire ? `<div class="avis-commentaire">${a.commentaire}</div>` : ''}
          </div>`).join('')
            : '<p class="avis-empty">Aucun avis pour le moment. Soyez le premier ! 🦆</p>';

        app.innerHTML = `
      <div class="product-grid">

        <!-- IMAGE -->
        <div class="image-wrap">
          <img src="${produit.image}" alt="${produit.nom}" onerror="this.src='https://placehold.co/400x400/fff8d6/f5c800?text=🦆'"/>
          ${produit.details.theme ? `<div class="badge-theme">${produit.details.theme}</div>` : ''}
        </div>

        <!-- INFO -->
        <div class="info">
          <h1 class="product-name">${produit.nom}</h1>

          <div class="price-row">
            <div class="price">${produit.prix.toFixed(2)} €</div>
            ${moy ? etoiles(moy) + `<small style="color:var(--gris);font-size:.85rem">${moy}/5 (${produit.avis.length} avis)</small>` : ''}
          </div>

          <p class="product-desc">${produit.description}</p>

          <div>
            <div class="details-title">Caractéristiques</div>
            <div class="details-grid">${detailsHTML}</div>
          </div>

          <button class="btn-panier" onclick="ajouterPanier(${produit.id})">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            Ajouter au panier
          </button>
        </div>
      </div>

      <!-- AVIS -->
      <div class="avis-section">
        <h2 class="section-heading">Avis clients</h2>
        <div class="avis-list">${avisHTML}</div>
      </div>
    `;
    }

    function ajouterPanier(id) {
        alert(`Produit #${id} ajouté au panier ! 🛒`);
        // → Remplace par ta vraie logique panier
    }

    // ─── Chargement principal ──────────────────────────────────
    async function init() {
        const id = getIdFromUrl();
        const app = document.getElementById('app');

        if (!id) {
            app.innerHTML = `<div class="state-msg"><span class="emoji">🤔</span>Aucun ID spécifié dans l'URL.<br><small>Exemple : <code>produit.html?id=1</code></small></div>`;
            return;
        }

        try {
            // Adapte le chemin vers ton fichier JSON
            const res = await fetch('../data/produits.json');
            const data = await res.json();
            const produit = data.produits.find(p => p.id === id);

            if (!produit) {
                app.innerHTML = `<div class="state-msg"><span class="emoji">🦆</span>Produit introuvable (id=${id}).</div>`;
                return;
            }

            document.title = produit.nom + ' — LSDuck';
            renderProduit(produit);

        } catch (err) {
            console.error(err);
            app.innerHTML = `<div class="state-msg"><span class="emoji">⚠️</span>Impossible de charger les données.<br><small>${err.message}</small></div>`;
        }
    }

    init();
</script>
</body>
</html>
